# JVM sizing for the Gradle daemon. Kotlin + KSP + AGP need headroom.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3g

# AndroidX
android.useAndroidX=true
# Each module gets its own R class instead of one fat merged one; keeps builds incremental.
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
